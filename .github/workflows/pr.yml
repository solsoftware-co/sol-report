name: PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

# One preview deploy per PR at a time — a new push supersedes an in-flight
# run rather than racing it to deploy the same sol-report-pr-<N> Worker.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run test:unit

  # Ephemeral per-PR preview Worker, same shape as sol-integrate's: deployed
  # as wrangler.toml's [env.preview] (no cron, SOL_API → sol-api-dev, public
  # workers.dev URL serving only /health) under a per-PR name, with its own
  # per-PR workflow. cleanup.yml deletes both when the PR closes.
  #
  # Skipped for PRs from forks: this repo is public, and GitHub withholds
  # secrets from fork PRs, so the deploy could never succeed there anyway.
  preview:
    name: Preview deploy + E2E
    needs: unit-test
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      WORKER_NAME: sol-report-pr-${{ github.event.pull_request.number }}
      WORKFLOW_NAME: sol-report-run-pr-${{ github.event.pull_request.number }}
      APP_VERSION: pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # wrangler 3 rejects --name together with --env, so the per-PR Worker
      # and workflow names are written into [env.preview] in this runner's
      # checkout only. Deploying without --env instead would silently use the
      # top-level SOL_API binding — production sol-api.
      - name: Name the preview worker and workflow for this PR
        run: |
          sed -i 's/^name = "sol-report-preview"$/name = "'"$WORKER_NAME"'"/' wrangler.toml
          sed -i 's/^name = "sol-report-run-preview"$/name = "'"$WORKFLOW_NAME"'"/' wrangler.toml
          grep -q "^name = \"$WORKER_NAME\"$" wrangler.toml || { echo "::error::failed to set [env.preview] name"; exit 1; }
          grep -q "^name = \"$WORKFLOW_NAME\"$" wrangler.toml || { echo "::error::failed to set [env.preview] workflow name"; exit 1; }
      # No Worker secrets yet (SOL_API_KEY arrives with phase 2), so one
      # deploy is enough. Once secrets exist, switch to sol-integrate's
      # deploy → secret bulk → redeploy sequence so code and secrets go live
      # together.
      - name: Deploy preview worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env preview --var APP_VERSION:${{ env.APP_VERSION }}
      - name: Set PREVIEW_URL
        run: echo "PREVIEW_URL=${{ steps.deploy.outputs.deployment-url }}" >> $GITHUB_ENV
      - name: Wait for this version to be serving
        run: |
          if [ -z "$PREVIEW_URL" ]; then
            echo "::error::wrangler-action did not report a deployment URL"
            exit 1
          fi
          # 3 consecutive hits on this run's APP_VERSION, not just any 200 —
          # an older version also answers /health while the new one rolls out.
          streak=0
          for i in $(seq 1 45); do
            version=$(curl -s "$PREVIEW_URL/health" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).data.version)}catch{}})')
            if [ "$version" = "$APP_VERSION" ]; then
              streak=$((streak + 1))
              if [ "$streak" -ge 3 ]; then
                echo "Version $APP_VERSION serving after $((i * 2))s"
                exit 0
              fi
            else
              streak=0
            fi
            sleep 2
          done
          echo "::error::Version $APP_VERSION not consistently serving within 90s (last seen: ${version:-none})"
          exit 1
      - name: Run E2E smoke tests
        run: npm run test:e2e
        env:
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
      - name: Post preview URL comment
        if: always()
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const success = '${{ job.status }}' !== 'failure';
            const icon = success ? '🚀' : '❌';
            const body = success
              ? `<!-- preview-url -->\n## Preview Deployment ${icon}\n**URL**: ${url}\n\nE2E smoke tests passed. The preview runs no cron; its workflow is \`${process.env.WORKFLOW_NAME}\`.`
              : `<!-- preview-url -->\n## Preview Deployment ${icon}\nDeployment or E2E tests failed. Check the [Actions log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('<!-- preview-url -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
